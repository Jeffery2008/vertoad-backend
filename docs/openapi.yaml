  /api/v1/cron/status:
    get:
      tags:
        - Cron
      operationId: getCronStatus
      summary: Check protected cron API status.
      description: Returns configured backend maintenance jobs and lock provider details.
      security:
        - CronTokenHeader: []
        - CronTokenQuery: []
      parameters:
        - name: X-Cron-Token
          in: header
          required: false
          description: Shared secret configured for the protected Cron API. Prefer this header over the query parameter.
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Query-string fallback for the cron shared secret.
          schema:
            type: string
      responses:
        "200":
          description: Cron API is reachable and the caller is authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronStatusData"
              examples:
                available:
                  summary: Authorized cron status response
                  value:
                    status: ok
                    jobs:
                      - redis-events-consume
                      - aggregate-statistics
                      - archive-parquet
                      - duckdb-cold-query
                      - ai-review-queue
                      - fraud-feature-compute
                      - expired-token-cleanup
                      - config-cache-refresh
                      - backup-check
                      - webhook-retry
                    lock_provider: redis
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cron/jobs/{job_name}/run:
    get:
      tags:
        - Cron
      operationId: runCronJob
      summary: Run a protected cron job.
      description: Runs one registered background job behind its distributed lock window.
      security:
        - CronTokenHeader: []
        - CronTokenQuery: []
      parameters:
        - name: job_name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Cron-Token
          in: header
          required: false
          description: Shared secret configured for the protected Cron API. Prefer this header over the query parameter.
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Query-string fallback for the cron shared secret.
          schema:
            type: string
      responses:
        "200":
          description: Cron job executed or was skipped because its lock is held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronJobRunData"
              examples:
                eventConsumption:
                  value:
                    job: redis-events-consume
                    status: completed
                    acquired_lock: true
                    metrics:
                      consumed: 250
                      billed: 240
                      skipped: 10
                      duplicates: 0
                    message: null
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: First-party bearer token or OAuth2 access token.
    CronTokenHeader:
      type: apiKey
      in: header
      name: X-Cron-Token
      description: Shared secret for protected cron endpoints.
    CronTokenQuery:
      type: apiKey
      in: query
      name: token
      description: Query-string fallback for protected cron endpoints.
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorObject"
          examples:
            unauthorized:
              summary: Missing or invalid cron token
              value:
                code: unauthorized
                message: Cron token is missing or invalid.
  parameters:
    OrganizationId:
      name: organization_id
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    WithdrawalId:
      name: withdrawal_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    EnvelopeBase:
      type: object
      description: Reserved shared envelope shape for future authenticated API slices; current implemented paths do not use it.
      required:
        - data
        - error
        - meta
        - request_id
      properties:
        data:
          description: Response payload for successful requests; null for errors.
        error:
          description: Error payload for failed requests; null for success.
        meta:
          type: object
          description: Response metadata such as pagination, version, or diagnostics.
          additionalProperties: true
        request_id:
          type: string
          minLength: 1
          description: Correlation identifier used for logs and support.
      additionalProperties: false
    SuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            error:
              type: "null"
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: "null"
            error:
              $ref: "#/components/schemas/ErrorObject"
    ErrorObject:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          description: Stable machine-readable error code.
          examples:
            - unauthorized
            - forbidden
        message:
          type: string
          minLength: 1
          description: Human-readable error message safe to return to API clients.
      additionalProperties: false
    PublisherSiteCreateRequest:
      type: object
      required:
        - name
        - domain
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        domain:
          type: string
          minLength: 1
          description: Hostname or URL that will be normalized to the registered publisher domain.
      additionalProperties: false
    PublisherSiteVerifyRequest:
      type: object
      required:
        - method
        - observed_value
      properties:
        method:
          type: string
          enum:
            - html_meta
            - dns_txt
            - verification_file
        observed_value:
          type: string
          minLength: 1
          description: Verification value observed from DNS, HTML meta, or the verification file.
      additionalProperties: false
    PublisherSite:
      type: object
      required:
        - id
        - organization_id
        - name
        - domain
        - status
        - verification_token
        - verified_at
      properties:
        id:
          type: integer
          minimum: 1
        organization_id:
          type: integer
          minimum: 1
        name:
          type: string
        domain:
          type: string
        status:
          type: string
          enum:
            - pending
            - verified
            - suspended
        verification_token:
          type: string
          description: Opaque server-generated secret used to derive public verification challenges.
        verified_at:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: false
    PublisherSiteVerificationChallenge:
      type: object
      required:
        - organization_id
        - site_id
        - method
        - verification_token
        - token
        - placement
        - name
        - expected_value
        - observed_value
      properties:
        organization_id:
          type: integer
          minimum: 1
        site_id:
          type: integer
          minimum: 1
        method:
          type: string
          enum:
            - html_meta
            - dns_txt
            - verification_file
        verification_token:
          type: string
          minLength: 1
          description: Opaque server-generated token expected in publisher-controlled verification evidence.
        token:
          type: string
        placement:
          type: string
          enum:
            - meta
            - dns_txt
            - file
        name:
          type: string
        expected_value:
          type: string
        observed_value:
          type:
            - string
            - "null"
          minLength: 1
      additionalProperties: false
    PublisherAdSlotResponsiveRule:
      type: object
      required:
        - min_width
        - width
        - height
      properties:
        min_width:
          type: integer
          minimum: 0
          maximum: 4096
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
      additionalProperties: false
    PublisherAdSlotCreateRequest:
      type: object
      required:
        - name
        - slot_key
        - size_preset
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slot_key:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,119}$"
        size_preset:
          type: string
          enum:
            - leaderboard
            - medium_rectangle
            - mobile_banner
            - wide_skyscraper
            - half_page
            - billboard
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
        responsive:
          type: boolean
          default: false
        responsive_rules:
          type: array
          items:
            $ref: "#/components/schemas/PublisherAdSlotResponsiveRule"
      additionalProperties: false
    PublisherAdSlot:
      type: object
      required:
        - id
        - site_id
        - organization_id
        - name
        - slot_key
        - width
        - height
        - size_preset
        - responsive
        - responsive_rules
        - status
      properties:
        id:
          type: integer
          minimum: 1
        site_id:
          type: integer
          minimum: 1
        organization_id:
          type: integer
          minimum: 1
        name:
          type: string
        slot_key:
          type: string
        width:
          type: integer
          minimum: 1
          maximum: 4096
        height:
          type: integer
          minimum: 1
          maximum: 4096
        size_preset:
          type:
            - string
            - "null"
        responsive:
          type: boolean
        responsive_rules:
          type: array
          items:
            $ref: "#/components/schemas/PublisherAdSlotResponsiveRule"
        status:
          type: string
      additionalProperties: false
    PublisherAdSlotPreset:
      type: object
      required:
        - width
        - height
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
      additionalProperties: false
    PublisherAdSlotPresetMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/PublisherAdSlotPreset"
    CampaignTargeting:
      type: object
      properties:
        devices:
          type: array
          items:
            type: string
        geos:
          type: array
          items:
            type: string
        site_ids:
          type: array
          items:
            type: integer
            minimum: 1
        slot_ids:
          type: array
          items:
            type: integer
            minimum: 1
        time_windows:
          type: array
          items:
            type: object
            required:
              - day_of_week
              - start
              - end
            properties:
              day_of_week:
                type: integer
                minimum: 0
                maximum: 6
              start:
                type: string
                pattern: "^[0-2][0-9]:[0-5][0-9]$"
              end:
                type: string
                pattern: "^[0-2][0-9]:[0-5][0-9]$"
            additionalProperties: false
      additionalProperties: false
    CampaignBudget:
      type: object
      properties:
        total_cap_points:
          type:
            - integer
            - "null"
          minimum: 1
        daily_cap_points:
          type:
            - integer
