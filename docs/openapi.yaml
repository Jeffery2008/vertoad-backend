openapi: 3.1.0
info:
  title: VertoAD API
  version: 0.1.0
  summary: Current VertoAD backend public API contract.
  description: |
    This contract documents only public HTTP endpoints that are implemented in
    the current backend slice.

    Current surface:
    - Base path: `/api/v1`.
    - Responses are JSON unless otherwise documented.
    - `/api/v1/health` is public.
    - `/api/v1/cron/status` is protected by the cron shared secret and optional
      IP allowlist.
    - OAuth2 and the standard response envelope are roadmap items and are not
      documented as active endpoint behavior until implemented.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:8080
    description: Local PHP built-in server
  - url: https://api.example.com
    description: Production placeholder
tags:
  - name: Health
    description: Runtime liveness and readiness checks.
  - name: Cron
    description: Protected backend maintenance task endpoints.
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check API health.
      description: Returns basic service liveness metadata.
      security: []
      responses:
        "200":
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthData"
              examples:
                healthy:
                  summary: Healthy API response
                  value:
                    status: ok
                    service: vertoad-api
                    environment: local
                    timestamp: "2026-06-06T14:00:00+00:00"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/cron/status:
    get:
      tags:
        - Cron
      operationId: getCronStatus
      summary: Check protected cron API status.
      description: Returns configured backend maintenance jobs and lock provider details.
      security:
        - CronTokenHeader: []
        - CronTokenQuery: []
      parameters:
        - name: X-Cron-Token
          in: header
          required: false
          description: Shared secret configured for the protected Cron API. Prefer this header over the query parameter.
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: Query-string fallback for the cron shared secret.
          schema:
            type: string
      responses:
        "200":
          description: Cron API is reachable and the caller is authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronStatusData"
              examples:
                available:
                  summary: Authorized cron status response
                  value:
                    status: ok
                    jobs:
                      - redis-events-consume
                      - aggregate-statistics
                      - archive-parquet
                      - duckdb-cold-query
                      - ai-review-queue
                      - fraud-feature-compute
                      - expired-token-cleanup
                      - config-cache-refresh
                      - backup-check
                      - webhook-retry
                    lock_provider: redis
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    CronTokenHeader:
      type: apiKey
      in: header
      name: X-Cron-Token
      description: Shared secret for protected cron endpoints.
    CronTokenQuery:
      type: apiKey
      in: query
      name: token
      description: Query-string fallback for protected cron endpoints.
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorObject"
          examples:
            unauthorized:
              summary: Missing or invalid cron token
              value:
                code: unauthorized
                message: Cron token is missing or invalid.
  schemas:
    EnvelopeBase:
      type: object
      description: Reserved shared envelope shape for future authenticated API slices; current implemented paths do not use it.
      required:
        - data
        - error
        - meta
        - request_id
      properties:
        data:
          description: Response payload for successful requests; null for errors.
        error:
          description: Error payload for failed requests; null for success.
        meta:
          type: object
          description: Response metadata such as pagination, version, or diagnostics.
          additionalProperties: true
        request_id:
          type: string
          minLength: 1
          description: Correlation identifier used for logs and support.
      additionalProperties: false
    SuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            error:
              type: "null"
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: "null"
            error:
              $ref: "#/components/schemas/ErrorObject"
    ErrorObject:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          description: Stable machine-readable error code.
          examples:
            - unauthorized
            - forbidden
        message:
          type: string
          minLength: 1
          description: Human-readable error message safe to return to API clients.
      additionalProperties: false
    HealthData:
      type: object
      required:
        - status
        - service
        - environment
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          examples:
            - vertoad-api
        environment:
          type: string
          examples:
            - local
            - testing
            - production
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
    HealthMeta:
      type: object
      properties:
        version:
          type: string
          examples:
            - "0.1.0"
      additionalProperties: true
    CronStatusData:
      type: object
      required:
        - status
        - jobs
        - lock_provider
      properties:
        status:
          type: string
          enum:
            - ok
        jobs:
          type: array
          items:
            type: string
            minLength: 1
        lock_provider:
          type: string
          enum:
            - redis
      additionalProperties: false
