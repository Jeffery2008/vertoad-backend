openapi: 3.1.0
info:
  title: VertoAD API
  version: 0.1.0
  summary: Current VertoAD backend public API contract.
  description: |
    This contract documents only public HTTP endpoints that are implemented in
    the current backend slice.

    Current surface:
    - Base path: `/api/v1`.
    - JSON responses are wrapped by the standard response envelope middleware
      unless otherwise documented.
    - `/api/v1/health` is public.
    - `/api/v1/permissions` is public bootstrap metadata for frontend route
      gating and developer tooling.
    - `/api/v1/cron/status` is protected by the cron shared secret and optional
      IP allowlist.
    - OAuth client self-service endpoints are implemented for organization-scoped
      developer applications; OAuth authorization and token exchange endpoints
      remain outside this slice.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:8080
    description: Local PHP built-in server
  - url: https://api.example.com
    description: Production placeholder
tags:
  - name: Auth
    description: First-party authentication and password reset endpoints.
  - name: OAuth
    description: Organization-scoped OAuth client self-service for developer applications.
  - name: Health
    description: Runtime liveness and readiness checks.
  - name: Cron
    description: Protected backend maintenance task endpoints.
  - name: Permissions
    description: Public permission metadata used for route gating and developer tooling.
  - name: Billing
    description: Advertiser points balance, ledger, and recharge-key redemption endpoints.
  - name: Publisher
    description: Publisher site verification, ad slot presets, and slot management endpoints.
  - name: Assets
    description: Creative asset upload intents, validation, and review preparation endpoints.
  - name: Serving
    description: Public ad serving, impression tracking, and click redirect endpoints.
  - name: Assets
    description: Authenticated creative asset upload intents, confirmation, and validation.
  - name: Campaigns
    description: Authenticated organization-scoped campaign planning and status management.
  - name: Reports
    description: Aggregate dashboard reporting for admin, advertiser, and publisher consoles.
  - name: Attribution
    description: Browser pixel and server API conversion attribution endpoints.
  - name: Archive
    description: Parquet archive manifests and asynchronous DuckDB cold-query jobs.
  - name: Operations
    description: Operational error logs, config versions, backup status, and Redis hardening.
  - name: Webhooks
    description: Webhook delivery status, retry, and signing metadata.
  - name: Support
    description: Support ticket queues, linked context, internal notes, and status updates.
  - name: FeatureFlags
    description: Feature flag rollout configuration and evaluation.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Register a first-party user.
      description: Creates an active first-party user account and returns non-sensitive user metadata.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: loginUser
      summary: Authenticate a first-party user.
      description: Verifies credentials for an active user and returns bearer token metadata for the first-party session bridge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginData"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutUser
      summary: Revoke the current first-party session bridge token.
      description: Requires an authenticated request context; token persistence and revocation are implemented by the auth layer.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                properties:
                  revoked:
                    type: boolean
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password-reset/request:
    post:
      tags:
        - Auth
      operationId: requestPasswordReset
      summary: Request a password reset.
      description: Always returns an accepted response for syntactically valid email input so account existence is not leaked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Password reset request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestData"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
        - Auth
      operationId: confirmPasswordReset
      summary: Confirm a password reset.
      description: Consumes a single-use reset token and updates the user's password hash.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetConfirmData"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Return the authenticated user context.
      description: Returns user metadata plus the active organization membership and permission codes when an organization scope is present.
      security:
        - BearerAuth: []
      parameters:
        - name: portal
          in: query
          required: false
          schema:
            type: string
            enum:
              - admin
              - advertiser
              - publisher
        - name: organization_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Current user context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeData"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check API health.
      description: Returns basic service liveness metadata.
      security: []
      responses:
        "200":
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthData"
              examples:
                healthy:
                  summary: Healthy API response
                  value:
                    status: ok
                    service: vertoad-api
                    environment: local
                    timestamp: "2026-06-06T14:00:00+00:00"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/permissions:
    get:
      tags:
        - Permissions
      operationId: getPermissionInventory
      summary: List platform permission metadata.
      description: |
        Returns stable permission-code metadata used by frontend navigation,
        developer tooling, and endpoint documentation. This endpoint is public
        bootstrap metadata; it does not grant authorization and backend
        permission checks remain mandatory on protected resources.
      security: []
      responses:
        "200":
          description: Permission metadata inventory.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PermissionMetadata"
              examples:
                inventory:
                  summary: Permission metadata response
                  value:
                    data:
                      - code: billing.recharge_key.view_plaintext.platform
                        domain: billing
                        scope: platform
                        description: View recharge key plaintext.
                        sensitive: true
                        audit_required: true
                    error: null
                    meta:
                      api_version: v1
                    request_id: req_0123456789abcdef
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/balance:
    get:
      tags:
        - Billing
      operationId: getBillingBalance
      summary: Return the advertiser points balance for an organization.
      description: Requires a bearer token and a positive `organization_id` query parameter.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Current advertiser balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingBalanceData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/ledger:
    get:
      tags:
        - Billing
      operationId: listBillingLedger
      summary: List recent points ledger entries for an organization.
      description: Returns newest entries first. Requires a bearer token and organization scope.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recent ledger entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingLedgerListData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/recharge-keys/redeem:
    post:
      tags:
        - Billing
      operationId: redeemRechargeKey
      summary: Redeem a recharge key into advertiser points.
      description: Credits advertiser balance through the append-only points ledger. Requires a bearer token and organization scope.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechargeKeyRedeemRequest"
      responses:
        "200":
          description: Recharge key redeemed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeKeyRedemptionData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/withdrawals:
    post:
      tags:
        - Billing
      operationId: requestPublisherWithdrawal
      summary: Request a publisher earnings withdrawal.
      description: Places a ledger hold by debiting the `publisher_earnings` account and creates an auditable withdrawal request.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalRequestCreate"
      responses:
        "201":
          description: Withdrawal request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRequestData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/withdrawals/{withdrawal_id}/paid:
    post:
      tags:
        - Billing
      operationId: markPublisherWithdrawalPaid
      summary: Mark a withdrawal as manually paid.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/WithdrawalId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalTransitionRequest"
      responses:
        "200":
          description: Withdrawal marked paid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRequestData"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/withdrawals/{withdrawal_id}/reject:
    post:
      tags:
        - Billing
      operationId: rejectPublisherWithdrawal
      summary: Reject a withdrawal and restore held publisher earnings.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/WithdrawalId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalTransitionRequest"
      responses:
        "200":
          description: Withdrawal rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRequestData"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/withdrawals/{withdrawal_id}/revoke:
    post:
      tags:
        - Billing
      operationId: revokePublisherWithdrawal
      summary: Revoke a requested withdrawal and restore held publisher earnings.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/WithdrawalId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalTransitionRequest"
      responses:
        "200":
          description: Withdrawal revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRequestData"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/withdrawals/{withdrawal_id}/proofs:
    post:
      tags:
        - Billing
      operationId: createWithdrawalProofUploadIntent
      summary: Create proof upload metadata and a presigned upload URL.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/WithdrawalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalProofCreateRequest"
      responses:
        "201":
          description: Proof upload intent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalProofIntentData"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/billing/withdrawals/{withdrawal_id}/proofs/confirm:
    post:
      tags:
        - Billing
      operationId: confirmWithdrawalProofUpload
      summary: Confirm a withdrawal proof object after upload.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/WithdrawalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalProofConfirmRequest"
      responses:
        "200":
          description: Proof upload confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalProofData"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/assets/upload-intents:
    post:
      tags:
        - Assets
      operationId: createAssetUploadIntent
      summary: Create a presigned creative asset upload intent.
      description: Creates a scoped object-storage upload intent for safe image, video, Fabric snapshot, or text creative assets.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadIntentRequest"
      responses:
        "201":
          description: Upload intent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUploadIntentData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/assets/confirm:
    post:
      tags:
        - Assets
      operationId: confirmAssetUpload
      summary: Confirm and validate an uploaded creative asset.
      description: Validates upload metadata, magic bytes, dimensions, and video duration before creating a pending-review asset and snapshot job marker.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetConfirmRequest"
      responses:
        "201":
          description: Uploaded asset accepted for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeAssetData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/assets/upload-intents:
    post:
      tags:
        - Assets
      operationId: createAssetUploadIntent
      summary: Create a creative asset upload intent.
      description: Creates an organization-scoped object key and deterministic presigned PUT upload descriptor for an allowed creative asset type.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadIntentRequest"
      responses:
        "201":
          description: Upload intent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUploadIntentData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/assets/confirm:
    post:
      tags:
        - Assets
      operationId: confirmAssetUpload
      summary: Confirm an uploaded creative asset.
      description: Validates uploaded object metadata, magic bytes, dimensions, and video bounds, then creates a pending-review asset and snapshot job marker.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetConfirmRequest"
      responses:
        "201":
          description: Asset accepted for review preparation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeAssetData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/campaigns:
    get:
      tags:
        - Campaigns
      operationId: listCampaigns
      summary: List organization campaigns.
      description: Returns campaigns scoped to the authenticated organization.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Campaign list returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Campaigns
      operationId: createCampaign
      summary: Create a campaign.
      description: Creates a draft or active campaign with schedule, targeting, bid, and budget caps.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpsertRequest"
      responses:
        "201":
          description: Campaign created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/campaigns/{campaign_id}:
    get:
      tags:
        - Campaigns
      operationId: getCampaign
      summary: Get a campaign.
      description: Returns one organization-scoped campaign by ID.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Campaign returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Campaigns
      operationId: updateCampaign
      summary: Update a campaign or transition status.
      description: Updates campaign planning fields or transitions status between draft, active, paused, and archived.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpsertRequest"
      responses:
        "200":
          description: Campaign updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignData"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/campaigns:
    post:
      tags:
        - Campaigns
      operationId: createCampaign
      summary: Create a campaign.
      description: Creates a draft or active campaign with schedule, targeting, bid, and budget caps.
      security:
        - BearerAuth: []
      parameters:
        - name: organization_id
